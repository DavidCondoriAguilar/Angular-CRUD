<!-- Notification -->
<div *ngIf="showNotification" class="notification">
  <i class="bi bi-check-circle"></i>
  {{ notificationMessage }}
</div>

<section class="py-4">
  <div class="container">
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4">
      <div class="col" *ngFor="let item of listaProducto">
        <div class="product-card">
          <div class="position-relative">
            <img [src]="'https://servicios.campus.pe/' + item.imagenchica" 
                 class="card-img-top" 
                 [alt]="item.nombre"
                 (error)="onImageError($event)">
          </div>
          <div class="card-body">
            <h5 class="card-title">{{item.nombre}}</h5>
          </div>
          <div class="card-footer">
            <div class="price-cart-container">
              <span class="price">S/ {{item.precio | number: '1.2-2'}}</span>
              <button class="add-to-cart-btn" (click)="$event.stopPropagation(); agregarCarrito(item)">
                <i class="bi bi-cart-plus"></i>
                <span>Agregar</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
